name: build

on:
  push:
    branches: [master, development, 'revision/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # paper-api 26.2 is Java 25 bytecode, and the pom compiles with release 25.
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B verify
