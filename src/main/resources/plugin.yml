name: CommonerVote
version: '${project.version}'
main: com.mcmiddleearth.commonervote.CommonerVotePlugin
api-version: '26.2'
depend: [LuckPerms]
authors: [Eriol_Eandur, Ivan1pl]
description: Team votes that promote guests to Commoner
website: https://github.com/MCME/CommonerVote

# No commands: block. The /vote command is registered with Brigadier.
permissions:
  commonervote.*:
    description: Grants every CommonerVote permission except exempt
    default: op
    children:
      commonervote.vote: true
      commonervote.staff: true
      commonervote.score: true
      commonervote.score.other: true
      commonervote.review: true
      commonervote.clear: true
      commonervote.config: true
      commonervote.promote: true
  commonervote.vote:
    description: Vote for a guest to become a Commoner
    default: op
  commonervote.staff:
    description: Vote with the staff vote weight
    default: op
    children:
      commonervote.vote: true
  commonervote.exempt:
    description: Marks a player as already past the vote, so nobody can vote for them
    default: op
  commonervote.score:
    description: See your own vote score
    default: true
  commonervote.score.other:
    description: See the vote score of other players
    default: op
  commonervote.review:
    description: See who voted for a player and why
    default: op
  commonervote.clear:
    description: Clear all votes for a player
    default: op
  commonervote.config:
    description: Change the CommonerVote settings in game
    default: op
  commonervote.promote:
    description: Promote a player to Commoner by hand
    default: op
